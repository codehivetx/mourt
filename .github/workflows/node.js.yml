name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # 22.x (Jod) and 24.x (Krypton) are the LTS lines; 26.x is "Current" and
      # enters LTS in Oct 2026, so it is included to catch breakage early rather
      # than on the day it is promoted.
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - run: npm ci

    # `npm test` runs `npm run build` first, so dist/ and dist-test/ both exist
    # before the e2e tests spawn bin/mourt. Do not append `|| true` here: the
    # suite is real now and a failure must fail the build.
    - run: npm test